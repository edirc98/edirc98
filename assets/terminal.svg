<svg xmlns="http://www.w3.org/2000/svg" width="900" height="453" viewBox="0 0 900 453" xml:space="preserve" role="img" aria-label="Terminal: whoami — Edgar Rodríguez de la Calle, Unity developer in Barcelona. 5+ years building VR apps and games with Unity/C#."><title>Terminal: whoami — Edgar Rodríguez de la Calle, Unity developer in Barcelona. 5+ years building VR apps and games with Unity/C#.</title><style>
text{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;white-space:pre}
.b{font-weight:700}
.px{animation:on .04s steps(1) backwards}
.show{animation:on .01s steps(1) backwards}
.blink{animation:blink 1s steps(1) infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite reverse}
@keyframes on{from{opacity:0}to{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

.type{animation-name:type;animation-fill-mode:backwards}
@keyframes type{from{transform:translateX(var(--w))}to{transform:translateX(0)}}
</style><rect width="900" height="453" fill="#0E0E0E"/><rect x="0" y="0" width="900" height="34" fill="#C8FF00"/><rect x="14" y="12" width="10" height="10" fill="#0A0A0A"/><rect x="30" y="12" width="10" height="10" fill="none" stroke="#0A0A0A" stroke-width="2"/><rect x="46" y="12" width="10" height="10" fill="none" stroke="#0A0A0A" stroke-width="2"/><text x="74" y="22" font-size="12" fill="#0A0A0A" letter-spacing="1" class="b" >edgar: ~/profile — zsh</text><text x="884" y="22" font-size="11" fill="#0A0A0A" text-anchor="end" letter-spacing="1" >TTY/01 · 900×42 · UTF-8</text><rect x="1" y="1" width="898" height="451" fill="none" stroke="#C8FF00" stroke-width="2"/><rect x="890" y="44" width="4" height="393" fill="#151515"/><rect x="890" y="44" width="4" height="60" fill="#2A2A2A"/><g class="show" style="animation-delay:0.50s"><text x="30" y="78" font-size="15"><tspan fill="#C8FF00" font-weight="700">$ </tspan><tspan fill="#E8E6DF">whoami</tspan></text><rect x="110.4" y="63" width="61.8" height="25" fill="#0E0E0E" class="type" style="--w:-61.8px;animation-duration:0.33s;animation-delay:0.65s;animation-timing-function:steps(6)"/></g><text x="48.6" y="103" font-size="15" class="show" style="animation-delay:1.18s"><tspan fill="#E8E6DF" font-weight="700">edgar rodríguez de la calle</tspan><tspan fill="#6E6E6E">  // unity developer · barcelona</tspan></text><g class="show" style="animation-delay:1.30s"><text x="30" y="140" font-size="15"><tspan fill="#C8FF00" font-weight="700">$ </tspan><tspan fill="#E8E6DF">cat about.txt</tspan></text><rect x="175.5" y="125" width="126.9" height="25" fill="#0E0E0E" class="type" style="--w:-126.9px;animation-duration:0.71s;animation-delay:1.45s;animation-timing-function:steps(13)"/></g><text x="48.6" y="165" font-size="15" class="show" style="animation-delay:2.36s"><tspan fill="#E8E6DF">5+ years building interactive VR apps &amp; games with Unity / C#.</tspan></text><text x="48.6" y="190" font-size="15" class="show" style="animation-delay:2.48s"><tspan fill="#C8FF00" font-weight="700">pro   </tspan><tspan fill="#B9B7B0">→ unity dev in a clinical VR research lab (IDIBAPS)</tspan></text><text x="48.6" y="215" font-size="15" class="show" style="animation-delay:2.60s"><tspan fill="#C8FF00" font-weight="700">side  </tspan><tspan fill="#B9B7B0">→ indie games · 3d printing · fpv drones · electronics</tspan></text><text x="48.6" y="240" font-size="15" class="show" style="animation-delay:2.73s"><tspan fill="#C8FF00" font-weight="700">core  </tspan><tspan fill="#B9B7B0">→ design patterns · SOLID · clean, scalable architecture</tspan></text><g class="show" style="animation-delay:2.85s"><text x="30" y="277" font-size="15"><tspan fill="#C8FF00" font-weight="700">$ </tspan><tspan fill="#E8E6DF">ls ./interests</tspan></text><rect x="184.8" y="262" width="136.2" height="25" fill="#0E0E0E" class="type" style="--w:-136.2px;animation-duration:0.77s;animation-delay:3.00s;animation-timing-function:steps(14)"/></g><text x="48.6" y="302" font-size="15" class="show" style="animation-delay:3.97s"><tspan fill="#C8FF00">ai/   computer-graphics/   3d-printing/   game-tech/   photography/</tspan></text><g class="show" style="animation-delay:4.08s"><text x="30" y="339" font-size="15"><tspan fill="#C8FF00" font-weight="700">$ </tspan><tspan fill="#E8E6DF">./status --now</tspan></text><rect x="184.8" y="324" width="136.2" height="25" fill="#0E0E0E" class="type" style="--w:-136.2px;animation-duration:0.77s;animation-delay:4.24s;animation-timing-function:steps(14)"/></g><text x="48.6" y="364" font-size="15" class="show" style="animation-delay:5.21s"><tspan fill="#C8FF00" font-weight="700">[LIVE] </tspan><tspan fill="#E8E6DF">balanz-it   ·  out on App Store + Google Play</tspan></text><text x="48.6" y="389" font-size="15" class="show" style="animation-delay:5.33s"><tspan fill="#FF2E63" font-weight="700">[DEV]  </tspan><tspan fill="#E8E6DF">jump-frog   ·  physics platformer, in development</tspan></text><g class="show" style="animation-delay:5.45s"><text x="30" y="414" font-size="15" fill="#C8FF00" font-weight="700">$</text><rect class="blink" x="48.6" y="401" width="9.3" height="17" fill="#C8FF00"/></g></svg>